[project]
name = "python-byte-string-decoder"
version = "0.1.0"
description = "Parses Python string literals containing escape sequences, octal, hex, and named unicode escapes, into their unescaped values."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
